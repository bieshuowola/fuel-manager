name: Android Debug APK
on:
  push:
    branches: ['android/**']
    paths: ['android/**', '.github/workflows/android.yml', 'index.html', 'icon.svg', 'manifest.webmanifest', 'tests/**']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'index.html', 'icon.svg', 'manifest.webmanifest', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Original model and Android projection
        run: node --test tests/model.test.js android/tests/projection.test.cjs
      - name: Kotlin tests, APK and lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Browser regression
        run: |
          npm install --prefix "$RUNNER_TEMP/fuel-browser" playwright@1.56.1
          "$RUNNER_TEMP/fuel-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fuel-browser/node_modules/playwright" CHROMIUM_PATH="$(node -e "process.stdout.write(require('$RUNNER_TEMP/fuel-browser/node_modules/playwright').chromium.executablePath())")" node android/tests/browser.cjs
      - name: Checksum
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fuel-manager-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
          retention-days: 30
